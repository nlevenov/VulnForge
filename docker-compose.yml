# Runs VulnForge in a container, published to the host's loopback ONLY.
# The "127.0.0.1:" prefix on the port mapping is deliberate: it keeps the
# deliberately-vulnerable app off every other interface on your machine.
services:
  vulnforge:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
